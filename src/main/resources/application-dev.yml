server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3310/bookstore?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  cache:
    type: redis

  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: BookStoreJwtSecretKeyForDevelopmentOnly2026VeryLongSecretKey
    expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,conditions,beans
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false

logging:
  level:
    org.springframework.security: DEBUG
