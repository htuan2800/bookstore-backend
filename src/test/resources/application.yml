spring:
  application:
    name: bookstore-backend-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  cache:
    type: none

app:
  jwt:
    secret: BookStoreJwtSecretKeyForDevelopmentOnly2026VeryLongSecretKey
    expiration-ms: 86400000

management:
  health:
    rabbit:
      enabled: false
    redis:
      enabled: false
