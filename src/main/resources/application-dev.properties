spring.datasource.url=jdbc:mysql://localhost:3310/bookstore?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.ddl-auto=update
server.port=8080

app.jwt.secret=BookStoreJwtSecretKeyForDevelopmentOnly2026VeryLongSecretKey
app.jwt.expiration-ms=86400000
logging.level.org.springframework.security=DEBUG
# logging.level.org.springframework.beans.factory=DEBUG
# logging.file.name=app.log

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.redis.enabled=false

# Cấu hình Redis Cache cho môi trường phát triển cục bộ
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379